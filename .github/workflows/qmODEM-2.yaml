name: 2QModem for Modern OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    name: Build QModem (${{ matrix.version }} - ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # --- OPENWRT 24.10 TARGETS (.ipk) ---
          - version: "24.10.6"
            arch: "aarch64_generic"
            sdk_url: "https://downloads.openwrt.org/releases/24.10.6/targets/armsr/armv8/openwrt-sdk-24.10.6-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          - version: "24.10.6"
            arch: "x86_64"
            sdk_url: "https://downloads.openwrt.org/releases/24.10.6/targets/x86/64/openwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"

          # --- OPENWRT 25.12 TARGETS (.apk) ---
          - version: "25.12.0"
            arch: "aarch64_generic"
            sdk_url: "https://downloads.openwrt.org/releases/25.12.4/targets/armsr/armv8/openwrt-sdk-25.12.4-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          - version: "25.12.0"
            arch: "x86_64"
            sdk_url: "https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/openwrt-sdk-25.12.4-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc rsync wget unzip zstd

      - name: Download and Setup OpenWrt SDK
        run: |
          wget -qO sdk.tar.zst "${{ matrix.sdk_url }}"
          mkdir sdk && tar --use-compress-program=zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm sdk.tar.zst

      - name: Fix and Set Clean QModem Feed
        run: |
          cd sdk
          # Menggunakan trik Base64 agar alamat web aman dan tidak terpotong otomatis oleh sistem GitHub Anda
          echo "" | base64 -d > feeds.conf.default
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

      - name: Compile QModem Packages
        run: |
          cd sdk
          make defconfig
          # Mengompilasi aplikasi utama QModem beserta seluruh paket pendukung kustom bawaannya
          make package/luci-app-qmodem/compile V=s -j$(nproc)

      - name: Organize Output Files
        run: |
          mkdir -p bin_output/${{ matrix.version }}/${{ matrix.arch }}
          find sdk/bin/ -name "*.ipk" -o -name "*.apk" | xargs -I {} cp {} bin_output/${{ matrix.version }}/${{ matrix.arch }}/

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QModem-${{ matrix.version }}--${{ matrix.arch }}-packages
          path: bin_output/${{ matrix.version }}/${{ matrix.arch }}/
